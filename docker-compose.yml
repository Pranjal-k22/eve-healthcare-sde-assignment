version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: eve_postgres_db
    restart: always
    environment:
      POSTGRES_USER: eve_user
      POSTGRES_PASSWORD: eve_password
      POSTGRES_DB: eve_healthcare_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eve_user -d eve_healthcare_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: eve_backend_api
    restart: always
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=Eve Healthcare Assignment API
      - ENV=production
      - DEBUG=False
      - POSTGRES_USER=eve_user
      - POSTGRES_PASSWORD=eve_password
      - POSTGRES_SERVER=db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=eve_healthcare_db
      - DATABASE_URL=postgresql://eve_user:eve_password@db:5432/eve_healthcare_db
      - SECRET_KEY=supersecretkeyforproductionenvironment123456!
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=60
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  postgres_data:
