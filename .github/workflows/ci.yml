name: CI & Docker Verification

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-postgresql:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci_secret_key_testing_12345678901234567890
      WEBHOOK_SECRET: ci_webhook_secret_testing_12345678901234567890
      POSTGRES_SERVER: "127.0.0.1"
      DATABASE_URL: postgresql://eve_user:eve_password@127.0.0.1:5432/eve_healthcare_db
      TEST_DATABASE_URL: postgresql://eve_user:eve_password@127.0.0.1:5432/eve_healthcare_db

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: eve_user
          POSTGRES_PASSWORD: eve_password
          POSTGRES_DB: eve_healthcare_db
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eve_user -d eve_healthcare_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Wait for PostgreSQL
        run: |
          until pg_isready -h 127.0.0.1 -p 5432 -U eve_user; do
            echo "Waiting for postgres..."
            sleep 1
          done

      - name: Run Alembic Database Migrations against PostgreSQL
        run: |
          python -c "from alembic.config import Config; from alembic import command; cfg = Config('alembic.ini'); command.upgrade(cfg, 'head')"

      - name: Run Pytest Suite against PostgreSQL
        run: |
          python -m pytest -v

      - name: Debug PostgreSQL & Test Failure Details
        if: failure()
        run: |
          python --version
          python -m alembic current || true
          python -c "import os; print('DATABASE_URL set:', bool(os.getenv('DATABASE_URL')))"
          python -c "import os; print('SECRET_KEY set:', bool(os.getenv('SECRET_KEY')))"
          python -c "import os; print('WEBHOOK_SECRET set:', bool(os.getenv('WEBHOOK_SECRET')))"

  docker-compose-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create .env configuration for Docker Compose
        run: |
          cp .env.example .env
          sed -i 's|SECRET_KEY=.*|SECRET_KEY=ci_secret_key_testing_12345678901234567890|' .env
          sed -i 's|WEBHOOK_SECRET=.*|WEBHOOK_SECRET=ci_webhook_secret_testing_12345678901234567890|' .env
          sed -i 's|POSTGRES_SERVER=localhost|POSTGRES_SERVER=db|' .env
          sed -i 's|DATABASE_URL=postgresql://eve_user:eve_password@localhost:5432/eve_healthcare_db|DATABASE_URL=postgresql://eve_user:eve_password@db:5432/eve_healthcare_db|' .env

      - name: Build and Start Docker Compose Stack
        env:
          SECRET_KEY: ci_secret_key_testing_12345678901234567890
          WEBHOOK_SECRET: ci_webhook_secret_testing_12345678901234567890
        run: |
          docker compose up -d --build

      - name: Verify Container Health & Status
        run: |
          echo "Waiting for Docker Compose stack to become healthy..."
          for i in {1..30}; do
            if curl -s -f http://localhost:8000/health > /dev/null; then
              echo "FastAPI health check passed!"
              curl -s http://localhost:8000/health
              echo ""
              docker compose ps
              exit 0
            fi
            echo "Attempt $i: http://localhost:8000/health not ready yet..."
            docker compose ps || true
            docker compose logs --tail=10 web || true
            sleep 2
          done
          echo "Health check timed out."
          exit 1

      - name: Debug Docker Failures & Logs
        if: failure()
        run: |
          echo "=== Docker Compose PS (All Containers) ==="
          docker compose ps -a
          echo "=== Docker Compose Web Logs ==="
          docker compose logs --tail=200 web
          echo "=== Docker Compose DB Logs ==="
          docker compose logs --tail=200 db


