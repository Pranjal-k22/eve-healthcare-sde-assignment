name: CI & Docker Verification

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: eve_user
          POSTGRES_PASSWORD: eve_password
          POSTGRES_DB: eve_healthcare_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eve_user -d eve_healthcare_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run Test Suite against PostgreSQL
        env:
          SECRET_KEY: ci_secret_key_testing_1234567890
          WEBHOOK_SECRET: ci_webhook_secret_testing_1234567890
          DATABASE_URL: postgresql://eve_user:eve_password@localhost:5432/eve_healthcare_db
        run: |
          python -m alembic upgrade head
          python -m pytest -v

      - name: Docker Compose Verification
        run: |
          cp .env.example .env
          sed -i 's/SECRET_KEY=.*/SECRET_KEY=ci_secret_key_testing_1234567890/' .env
          sed -i 's/WEBHOOK_SECRET=.*/WEBHOOK_SECRET=ci_webhook_secret_testing_1234567890/' .env
          docker compose up -d --build
          sleep 10
          docker compose ps
          docker compose logs --tail=50
          curl -f http://localhost:8000/health || exit 1
